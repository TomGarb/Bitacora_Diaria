<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Bitácora DOC</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='Css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='Css/login.css') }}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">
          <i class="bi bi-hdd-rack"></i>
        </div>
        <h1>Bitácora de Operaciones DOC</h1>
        <p>Sistema Centralizado Multi-Región</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="toast toast-{{ category }}" style="position: relative; right: auto; bottom: auto; margin-bottom: 1rem; animation: none;">
              <i class="bi bi-info-circle-fill"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
          <label class="form-label" for="username">Usuario u Operador</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Ej: op_buenosaires" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" value="demo123" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
          <i class="bi bi-box-arrow-in-right"></i> Ingresar al Sistema
        </button>
      </form>

      <!-- Selector Rápido de Demo Users -->
      <div class="demo-users-box">
        <div class="demo-title">
          <i class="bi bi-person-workspace"></i> Cuentas Demo para Pruebas Rápidas
        </div>
        <div class="demo-chips">
          <button type="button" class="demo-chip" data-username="supervisor_ar" data-password="demo123">
            <div>
              <div class="demo-chip-name">supervisor_ar (Supervisor DOC)</div>
              <div class="demo-chip-sub">Región: Buenos Aires | Rol: sub_admin</div>
            </div>
            <span class="badge badge-programada">sub-admin</span>
          </button>

          <button type="button" class="demo-chip" data-username="op_buenosaires" data-password="demo123">
            <div>
              <div class="demo-chip-name">op_buenosaires (Operador)</div>
              <div class="demo-chip-sub">Región: Buenos Aires | Rol: operador</div>
            </div>
            <span class="badge badge-en_progreso">operador</span>
          </button>

          <button type="button" class="demo-chip" data-username="op_santiago" data-password="demo123">
            <div>
              <div class="demo-chip-name">op_santiago (Operador)</div>
              <div class="demo-chip-sub">Región: Santiago de Chile | Rol: operador</div>
            </div>
            <span class="badge badge-en_progreso">operador</span>
          </button>

          <button type="button" class="demo-chip" data-username="admin_global" data-password="demo123">
            <div>
              <div class="demo-chip-name">admin_global (Administrador)</div>
              <div class="demo-chip-sub">Acceso Total | Rol: admin</div>
            </div>
            <span class="badge badge-cancelada">admin</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='Js/base.js') }}"></script>
  <script src="{{ url_for('static', filename='Js/login.js') }}"></script>
</body>
</html>
