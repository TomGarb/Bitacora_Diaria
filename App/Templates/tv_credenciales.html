<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV DOC - Credenciales Especiales Activas</title>
  
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Estilos TV Credenciales -->
  <link rel="stylesheet" href="{{ url_for('static', filename='Css/tv_credenciales.css') }}">
</head>
<body>
  <input type="hidden" id="tv-region-id" value="{{ region.id if region else 1 }}">

  <!-- Header TV Superior -->
  <header class="tv-header">
    <div class="tv-brand">
      <div class="tv-brand-icon">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <div>
        <div class="tv-brand-title">DOC MONITORING — {{ region.nombre.upper() if region else 'DATACENTER' }}</div>
        <div class="tv-brand-subtitle">Credenciales Especiales & Control de Permisos</div>
      </div>
    </div>

    <div class="tv-header-center">
      <div class="tv-counter-pill">
        <i class="bi bi-key-fill"></i>
        <span>VIGENTES AHORA: <strong id="count-activas" style="color:#ffffff; font-size:1.25rem;">0</strong> / <span id="count-total">0</span></span>
      </div>
      <div id="tv-shift-label" style="font-family:'Chakra Petch', sans-serif; font-weight:700; color:var(--tv-text-bright); font-size:1.05rem; letter-spacing:1px;">
        TURNO ACTIVO
      </div>
    </div>

    <div class="tv-header-right">
      <div id="tv-clock" class="tv-clock-box">--:--:--</div>
    </div>
  </header>

  <!-- Viewport de Tarjetas Gigantes -->
  <main class="tv-viewport-container" id="viewport-container">
    <div class="tv-credentials-grid" id="credenciales-grid">
      <div style="color:var(--tv-text-muted); font-size:1.2rem; text-align:center; padding:3rem;">Cargando credenciales activas...</div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='Js/tv_credenciales.js') }}"></script>
</body>
</html>
